<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic & Glass Gradients for high-end styling -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#1f1f2e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Capsule -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#logo-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Sleek Play Button & Film Shutter Overlay -->
  <g transform="translate(10, 10)">
    <!-- Main stylized V-Cutout and Play shape -->
    <path d="M 25 20 L 55 40 L 25 60 Z" fill="url(#accent-grad)" opacity="0.95" />
    
    <!-- Dynamic Shutter Blade 1 -->
    <path d="M 50 15 L 65 30 L 60 15 Z" fill="#ffffff" opacity="0.8" />
    <!-- Dynamic Shutter Blade 2 -->
    <path d="M 68 35 L 53 50 L 68 45 Z" fill="#ffffff" opacity="0.6" />
    
    <!-- Intersecting Sleek Line -->
    <path d="M 15 15 L 65 65" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
